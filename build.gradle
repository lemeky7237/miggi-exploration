plugins {
    id 'net.fabricmc.fabric-loom' version '1.18-SNAPSHOT'
}

version = project.mod_version
group = project.maven_group
base { archivesName = project.archives_base_name }

loom {
    splitEnvironmentSourceSets()
    // In-game automated test (screenshots + checks), used by the client-test CI job.
    runs {
        clientGameTest {
            client()
            name "Client Game Test"
            vmArg "-Dfabric.client.gametest"
            runDir "build/clientgametest"
        }
    }
    mods {
        "miggi_exploration" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

repositories {
    maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' }
}

dependencies {
    // Only for running the game in development / the automated in-game test; not bundled in the jar.
    localRuntime "maven.modrinth:biolith:3.8.0-beta.1"

    // 26.x is unobfuscated: plain implementation, no mappings / modImplementation.
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") { expand "version": version }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}
